name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  build:
    name: Build distributables
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and source tarball
        run: |
          pip install build
          python -m build

      - name: List dist artifacts
        run: ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  validate-install:
    name: Validate wheel install
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install from wheel in a clean environment
        run: pip install dist/*.whl

      - name: Verify imports
        run: |
          python -c "
          from briza_sdk import BrizaClient, BrizaAPIError, WebhookHandler, verify_signature
          from briza_sdk.webhooks import create_flask_app, create_fastapi_router
          print('All imports OK')
          print('Version:', __import__('briza_sdk').__version__)
          "
